<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="leafGradLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="leafGradRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-opacity="0.25" />

  <!-- Decorative Orbit Arc representing Circular Economy / Recycling -->
  <path d="M 120 256 A 136 136 0 1 1 392 256" fill="none" stroke="#6ee7b7" stroke-width="14" stroke-dasharray="16 12" stroke-linecap="round" opacity="0.3"/>
  <circle cx="392" cy="256" r="10" fill="#f59e0b"/>

  <!-- Sprout / Plant Illustration -->
  <g filter="url(#glow)">
    <!-- Soil Mound / Base -->
    <path d="M 176 390 C 210 375, 302 375, 336 390 C 310 408, 202 408, 176 390 Z" fill="#065f46" opacity="0.7"/>

    <!-- Main Stem -->
    <path d="M 256 384 C 256 310, 252 230, 256 160" fill="none" stroke="url(#stemGrad)" stroke-width="20" stroke-linecap="round"/>

    <!-- Left Leaf -->
    <path d="M 256 280 C 180 270, 130 210, 150 140 C 220 140, 250 210, 256 280 Z" fill="url(#leafGradLeft)"/>
    <path d="M 256 280 C 220 240, 180 200, 150 140" fill="none" stroke="#047857" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

    <!-- Right Leaf -->
    <path d="M 256 230 C 320 220, 375 165, 360 100 C 290 95, 260 160, 256 230 Z" fill="url(#leafGradRight)"/>
    <path d="M 256 230 C 290 195, 330 155, 360 100" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

    <!-- Sparkle / EcoPoint Star -->
    <g transform="translate(372, 110) scale(0.9)">
      <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#f59e0b"/>
      <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3" fill="#fde68a"/>
    </g>
  </g>
</svg>
